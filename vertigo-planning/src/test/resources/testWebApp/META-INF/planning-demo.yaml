---
boot:
  params:
    locales: fr_FR
  plugins:
    - io.vertigo.core.plugins.resource.classpath.ClassPathResourceResolverPlugin: {}
    - io.vertigo.vega.plugins.webservice.servlet.ServletResourceResolverPlugin: {}
    - io.vertigo.core.plugins.param.env.EnvParamPlugin: {}
    - io.vertigo.planning.demo.boot.PlanningDemoJdbcParamPlugin: {}
    - io.vertigo.vega.plugins.webservice.servlet.WebAppContextParamPlugin: {}
modules:
  io.vertigo.commons.CommonsFeatures:
    features:
      - script:
    featuresConfig:
      - script.janino:
  io.vertigo.database.DatabaseFeatures:
    features:
      - sql:
    featuresConfig:
      - sql.c3p0:
          dataBaseClass: io.vertigo.database.impl.sql.vendor.postgresql.PostgreSqlDataBase
          jdbcDriver: org.postgresql.Driver
          jdbcUrl: ${PLANNING_DEMO_JDBC_URL}
  io.vertigo.datamodel.DataModelFeatures:
  io.vertigo.datastore.DataStoreFeatures:
    features:
      - cache:
      - entitystore:
      - kvStore:
    featuresConfig:
      - cache.memory:
      - entitystore.sql:
      - kvStore.delayedMemory:
          collections: VViewContext, VViewInitContext, protected-value
          timeToLiveSeconds: 3600
  io.vertigo.datafactory.DataFactoryFeatures:
  io.vertigo.account.AccountFeatures:
    features:
      - authorization:
      - security:
          userSessionClassName: io.vertigo.planning.demo.PlanningDemoUserSession
  io.vertigo.vega.VegaFeatures: # the json engine of vertigo-ui
  io.vertigo.planning.PlanningFeatures:
  io.vertigo.planning.agenda.AgendaFeatures:
    featuresConfig:
      - services.config:
          # publishing now is done at once (60 seconds by default, a delay to revert) : the tests check the state right after
          publishNowDelaySecond: 0
      - foConsultation.db:
initializers:
  - io.vertigo.planning.demo.boot.PlanningDemoDataInitializer:
