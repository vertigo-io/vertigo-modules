<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:vu="https://vertigo.io/thymeleaf/vertigo-ui"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{templates/demoLayout}">
<head>
	<title>Planning du cabinet (lecture seule)</title>
</head>
<body>
	<h1 class="text-h5 q-mt-none" layout:fragment="page-title">Planning du cabinet (lecture seule)</h1>
	<th:block layout:fragment="content">
		<p>Consultation : sans création, modification ni suppression de plage ou de créneau.</p>
		<!--/* read only : no action on the plages, no creation on the calendar, no deletion of a slot in the detail ; the action buttons are the page ones (none here) */-->
		<vu:agenda-week eventNameTwoLetters="true" eventIconAgenda="person" multiEventIconAgenda="groups" hasAuthzAdmin="${false}">
			<vu:slot name="agenda_actions_slot"></vu:slot>
		</vu:agenda-week>
		<vu:agenda-create-plage/>
		<vu:agenda-edit-plage/>
		<vu:agenda-detail-plage/>
		<vu:agenda-delete-plage/>
		<vu:agenda-publish-plage/>
		<vu:agenda-duplicate-week/>
		<vu:agenda-duplicate-day/>
	</th:block>
</body>
</html>
